<!doctype html>
<meta charset="utf-8">
<title>ORT-web denoiser benchmark</title>
<body style="font:14px monospace;background:#0e1117;color:#e8ecf5"><pre id="o">running…</pre>
<script type="module">
// Dev-only benchmark: loads an ONNX denoiser into onnxruntime-web and times single forward passes (one "NFE")
// and a full 3-step Euler frame. Results are left in window.__bench for the Node runner.
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs';
const q = new URLSearchParams(location.search);
const model = q.get('model');
const ep = q.get('ep') || 'webgpu';
const layout = q.get('layout') || 'NHWC';
const N = +(q.get('n') || 40);
const opt = q.get('opt') || 'all';
const out = (s) => { document.getElementById('o').textContent += '\n' + s; };
const res = { model, ep, layout, opt, n: N, userAgent: navigator.userAgent };
try {
  if (ep === 'webgpu') {
    const ad = await navigator.gpu?.requestAdapter();
    res.adapter = ad ? { vendor: ad.info?.vendor, architecture: ad.info?.architecture, device: ad.info?.device,
      description: ad.info?.description, features: [...ad.features].filter((f) => f.includes('f16') || f.includes('timestamp')) } : null;
    if (!ad) throw new Error('no WebGPU adapter');
  }
  if (q.get('profile')) ort.env.webgpu.profiling = { mode: 'default' };
  ort.env.wasm.numThreads = +(q.get('threads') || 1);
  const t0 = performance.now();
  const providers = ep === 'webgpu' ? [{ name: 'webgpu', preferredLayout: layout }] : ['wasm'];
  const sess = await ort.InferenceSession.create(model, { executionProviders: providers, graphOptimizationLevel: opt });
  res.load_ms = performance.now() - t0;
  const rnd = (n, f) => Float32Array.from({ length: n }, f);
  const feeds = {
    x: new ort.Tensor('float32', rnd(3 * 64 * 64, () => Math.random() * 2 - 1), [1, 3, 64, 64]),
    sigma: new ort.Tensor('float32', [0.7], [1]),
    ctx: new ort.Tensor('float32', rnd(12 * 64 * 64, () => Math.random() * 2 - 1), [1, 12, 64, 64]),
    act: new ort.Tensor('float32', (() => { const a = new Float32Array(36); for (let k = 0; k < 4; k++) { a[k * 9 + 1] = 1; a[k * 9 + 3] = 1; a[k * 9 + 6] = 1; } return a; })(), [1, 4, 9]),
    ctx_sigma: new ort.Tensor('float32', [0.1], [1]),
  };
  for (let i = 0; i < 6; i++) await sess.run(feeds);
  const times = [];
  for (let i = 0; i < N; i++) {
    const t = performance.now();
    const o = await sess.run(feeds);
    const d = o.denoised.data[0];
    times.push(performance.now() - t);
  }
  times.sort((a, b) => a - b);
  res.nfe_ms_median = times[Math.floor(N / 2)];
  res.nfe_ms_p10 = times[Math.floor(N * 0.1)];
  res.nfe_ms_p90 = times[Math.floor(N * 0.9)];
  // full frame: K sequential Euler steps with the JS update between runs
  const sigmas = { 1: [5, 0], 2: [5, 0.04, 0], 3: [5, 0.2831, 0.002, 0] };
  res.frame = {};
  for (const K of [1, 2, 3]) {
    const s = sigmas[K];
    const ft = [];
    for (let rep = 0; rep < Math.max(10, N / 2); rep++) {
      const t = performance.now();
      let x = rnd(3 * 64 * 64, () => (Math.random() * 2 - 1) * s[0]);
      for (let i = 0; i < K; i++) {
        feeds.x = new ort.Tensor('float32', x, [1, 3, 64, 64]);
        feeds.sigma = new ort.Tensor('float32', [s[i]], [1]);
        const o = await sess.run(feeds);
        const D = o.denoised.data;
        const dt = s[i + 1] - s[i];
        const nx = new Float32Array(x.length);
        for (let j = 0; j < x.length; j++) nx[j] = x[j] + ((x[j] - D[j]) / s[i]) * dt;
        x = nx;
      }
      ft.push(performance.now() - t);
    }
    ft.sort((a, b) => a - b);
    res.frame[K] = { ms_median: ft[Math.floor(ft.length / 2)], fps: 1000 / ft[Math.floor(ft.length / 2)] };
  }
} catch (e) {
  res.error = String(e && e.stack || e);
}
window.__bench = res;
out(JSON.stringify(res, null, 1));
</script>
