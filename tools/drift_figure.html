<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Dream drift figure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* the media figure of the project: rendered by tools/render_drift.mjs (headless Edge) from results/eval_<name>.json,
     so every number on it comes from that file */
  :root { --bg:#0e1117; --panel:#151a23; --line:#2e3a52; --text:#e8ecf5; --muted:#8893ab; --amber:#f59e0b;
          --font:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { width: 1080px; height: 1350px; overflow: hidden; font: 400 21px/1.4 var(--font); position: relative;
         background: radial-gradient(900px 500px at 85% -5%, rgba(245,158,11,.10), transparent 60%), var(--bg); }
  .fig { padding: 54px 54px 0; }
  .kicker { margin: 0 0 14px; font: 500 14px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; gap: 12px; }
  .mark { width: 22px; height: 22px; }
  h1 { margin: 0; font: 700 47px/1.06 var(--font); letter-spacing: -.02em; font-variation-settings: "opsz" 72; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--amber); }
  .sub { margin: 12px 0 22px; color: var(--muted); font-size: 19px; line-height: 1.4; max-width: 900px; text-wrap: balance; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px 16px; margin-bottom: 18px; }
  .card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .lab { font: 600 14px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text); }
  .unit { font: 400 14px/1 var(--mono); color: var(--muted); }
  .note { margin: 8px 0 2px; color: var(--muted); font-size: 16px; line-height: 1.38; max-width: 900px; }
  .note b { color: var(--text); font-weight: 600; }
  svg { display: block; overflow: visible; }
  svg text { font-family: var(--mono); }
  .tick { fill: var(--muted); font-size: 14px; }
  .axis-title { fill: var(--muted); font-size: 14px; letter-spacing: .04em; }
  .callout { font-family: var(--font); font-size: 20px; font-weight: 600; fill: var(--text); }
  .callout-mono { font-size: 15px; fill: var(--amber); font-weight: 600; }
  .legend-t { font-family: var(--font); font-size: 17px; fill: var(--text); }
  footer { position: absolute; left: 54px; right: 54px; bottom: 34px; color: var(--muted); font: 400 13.5px/1.55 var(--mono); }
  footer b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<main class="fig">
  <p class="kicker">
    <svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#e8ecf5"/><rect x="9" y="1" width="6" height="6" fill="#2e3a52"/><rect x="1" y="9" width="6" height="6" fill="#2e3a52"/><rect x="9" y="9" width="6" height="6" fill="#f59e0b"/></svg>
    dream engine &middot; drift
  </p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <section class="card">
    <div class="card-h"><span class="lab">Same place as the real game?</span><span class="unit">PSNR vs the real frame, dB</span></div>
    <svg id="s1" width="924" height="500"></svg>
  </section>

  <section class="card">
    <div class="card-h"><span class="lab">Does it still look like this game?</span><span class="unit">PSNR to nearest real frame, dB</span></div>
    <p class="note" id="n2"></p>
    <svg id="s2" width="924" height="246"></svg>
  </section>
</main>
<footer id="foot"></footer>

<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const path = q.get('eval');
  const d = await (await fetch('/' + path)).json();
  const fc = d.figure_curves, rp = d.rollout_primary, v = d.validity_nearest_real_frame_psnr, cfg = d.primary_config;
  const L = fc.horizon, E = fc.episodes;
  const el = (id) => document.getElementById(id);
  const f1 = (x) => x.toFixed(1);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs = {}, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };

  // ---- text, all from the json
  const pe = rp.per_episode_frames_until_below_20db;               // per-episode tracking horizon (median, middle half)
  const track = pe ? Math.round(pe.median) : rp.frames_until_psnr_below_20db;
  const q1 = pe ? Math.round(pe.p25) : null, q3 = pe ? Math.round(pe.p75) : null;
  el('title').innerHTML = `The dream follows the real game for about <em>${track} frames</em>, then dreams its own place`;
  el('sub').textContent = `Same keypresses on both sides, no real frames after the first four. "Tracks" = PSNR above 20 dB; the marker is the median of ${E} held-out episodes.`;

  // ---- helpers
  const log2 = Math.log2;
  const smoothLog = (a, frac) => a.map((_, i) => { const f = i + 1; const lo = Math.max(0, Math.floor(f * (1 - frac)) - 1), hi = Math.min(a.length - 1, Math.ceil(f * (1 + frac)) - 1); let s = 0; for (let j = lo; j <= hi; j++) s += a[j]; return s / (hi - lo + 1); });
  const ticks = []; for (let f = 1; f <= L; f *= 2) ticks.push(f);
  const niceStep = (range, maxTicks) => { for (const s of [1, 2, 5, 10, 20]) if (range / s <= maxTicks) return s; return 20; };
  const niceRange = (lo, hi, step) => [Math.floor(lo / step) * step, Math.ceil(hi / step) * step];

  function frame(svg, W, H, m, yMin, yMax, yStep) {
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const X = (f) => m.l + (log2(f) / log2(L)) * iw;
    const Y = (y) => m.t + (1 - (y - yMin) / (yMax - yMin)) * ih;
    for (let y = yMin; y <= yMax + 1e-9; y += yStep) {
      mk('line', { x1: m.l, x2: W - m.r, y1: Y(y), y2: Y(y), stroke: '#2e3a52', 'stroke-width': 1, opacity: .75 }, svg);
      mk('text', { x: m.l - 12, y: Y(y) + 5, 'text-anchor': 'end', class: 'tick' }, svg, String(y));
    }
    for (const f of ticks) {
      mk('line', { x1: X(f), x2: X(f), y1: m.t, y2: H - m.b, stroke: '#2e3a52', 'stroke-width': 1, opacity: .35 }, svg);
      mk('text', { x: X(f), y: H - m.b + 24, 'text-anchor': 'middle', class: 'tick' }, svg, String(f));
    }
    mk('text', { x: m.l + iw / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title' }, svg, 'frames since wake-up (log scale)');
    return { X, Y, iw, ih };
  }
  const pathOf = (a, X, Y) => a.map((y, i) => `${i ? 'L' : 'M'}${X(i + 1).toFixed(1)},${Y(y).toFixed(1)}`).join('');

  // ---- panel 1: tracking
  {
    const svg = el('s1'), W = 924, H = 500, m = { l: 48, r: 14, t: 18, b: 58 };
    const dream = fc.dream_mean, lo = fc.dream_p25, hi = fc.dream_p75, frz = fc.freeze_mean, unr = fc.unrelated_mean;
    const [y0, yMax] = niceRange(Math.min(...unr, ...dream.slice(8)) - 1, Math.max(...dream) + 1.2, 5);
    const yMin = y0 - 5;                                 // a free lane under the curves for the annotation
    const { X, Y } = frame(svg, W, H, m, yMin, yMax, 5);
    const sm = (a) => smoothLog(a, 0.12);
    // band between the quartiles of the episodes
    const sLo = sm(lo), sHi = sm(hi);
    const band = sHi.map((y, i) => `${i ? 'L' : 'M'}${X(i + 1).toFixed(1)},${Y(y).toFixed(1)}`).join('') + sLo.map((y, i) => `L${X(sLo.length - i).toFixed(1)},${Y(sLo[sLo.length - 1 - i]).toFixed(1)}`).join('') + 'Z';
    mk('path', { d: band, fill: '#f59e0b', opacity: .16 }, svg);
    mk('path', { d: pathOf(sm(unr), X, Y), fill: 'none', stroke: '#8893ab', 'stroke-width': 2, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round' }, svg);
    mk('path', { d: pathOf(sm(frz), X, Y), fill: 'none', stroke: '#8893ab', 'stroke-width': 2.2, 'stroke-dasharray': '9 6' }, svg);
    // 20 dB threshold and the tracking horizon
    mk('line', { x1: m.l, x2: W - m.r, y1: Y(20), y2: Y(20), stroke: '#f59e0b', 'stroke-width': 1.4, 'stroke-dasharray': '3 5', opacity: .55 }, svg);
    mk('text', { x: W - m.r - 4, y: Y(20) - 8, 'text-anchor': 'end', class: 'tick', fill: '#f59e0b', style: 'fill:#f59e0b;opacity:.85' }, svg, '20 dB');
    mk('path', { d: pathOf(sm(dream), X, Y), fill: 'none', stroke: '#f59e0b', 'stroke-width': 4.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    const tx = X(track), ty = Y(sm(dream)[Math.min(track, dream.length) - 1]);
    const laneY = Y(yMin + 4.4);
    mk('line', { x1: tx, x2: tx, y1: ty, y2: laneY, stroke: '#e8ecf5', 'stroke-width': 1.4, 'stroke-dasharray': '2 4', opacity: .8 }, svg);
    if (q1 != null) {                                              // middle half of the episodes: where they fall below 20 dB
      mk('line', { x1: X(q1), x2: X(q3), y1: laneY, y2: laneY, stroke: '#e8ecf5', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .9 }, svg);
      for (const f of [q1, q3]) mk('line', { x1: X(f), x2: X(f), y1: laneY - 7, y2: laneY + 7, stroke: '#e8ecf5', 'stroke-width': 2.4 }, svg);
    }
    mk('circle', { cx: tx, cy: ty, r: 6.5, fill: '#0e1117', stroke: '#e8ecf5', 'stroke-width': 2.4 }, svg);
    mk('circle', { cx: tx, cy: laneY, r: 5.5, fill: '#e8ecf5' }, svg);
    mk('text', { x: tx + 14, y: laneY + 32, class: 'callout' }, svg, `tracks about ${track} frames`);
    mk('text', { x: tx + 14, y: laneY + 52, class: 'tick', style: 'fill:#8893ab' }, svg,
       q1 != null ? `bar: middle half of the episodes (frames ${q1} to ${q3})` : 'after that it dreams its own place');
    // values at the horizons quoted in the README
    for (const h of [8, 32, 128]) {
      if (h > L) continue;
      const y = rp.psnr_at[String(h)];
      if (y == null) continue;
      const px = X(h), py = Y(y);
      mk('circle', { cx: px, cy: py, r: 5.5, fill: '#f59e0b', stroke: '#0e1117', 'stroke-width': 2.5 }, svg);
      mk('text', { x: px, y: py - 16, 'text-anchor': 'middle', class: 'callout-mono' }, svg, `${f1(y)}`);
    }
    // legend (top right, where the curves have already come down)
    const lx = W - m.r - 292, ly = m.t + 14;
    mk('rect', { x: lx - 14, y: ly - 18, width: 292, height: 130, rx: 10, fill: '#0e1117', opacity: .72 }, svg);
    mk('rect', { x: lx, y: ly + 78, width: 34, height: 14, rx: 3, fill: '#f59e0b', opacity: .3 }, svg);
    mk('text', { x: lx + 46, y: ly + 90, class: 'legend-t' }, svg, 'middle half of the episodes');
    mk('line', { x1: lx, x2: lx + 34, y1: ly, y2: ly, stroke: '#f59e0b', 'stroke-width': 4.2, 'stroke-linecap': 'round' }, svg);
    mk('text', { x: lx + 46, y: ly + 5, class: 'legend-t' }, svg, 'dream');
    mk('line', { x1: lx, x2: lx + 34, y1: ly + 30, y2: ly + 30, stroke: '#8893ab', 'stroke-width': 2.2, 'stroke-dasharray': '9 6' }, svg);
    mk('text', { x: lx + 46, y: ly + 35, class: 'legend-t' }, svg, 'freeze the last real frame');
    mk('line', { x1: lx, x2: lx + 34, y1: ly + 60, y2: ly + 60, stroke: '#8893ab', 'stroke-width': 2, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round' }, svg);
    mk('text', { x: lx + 46, y: ly + 65, class: 'legend-t' }, svg, `unrelated frame (${f1(d.baseline_unrelated_frame_psnr)} dB)`);
  }

  // ---- panel 2: validity
  {
    const bank = (v.note.match(/among (\d+) real/) || [])[1];
    el('n2').innerHTML = `Each frame against its closest match among ${bank ? Number(bank).toLocaleString('en') : 'many'} real game frames: dreamed frames average <b>${f1(v.dream_mean)} dB</b>, true game frames <b>${f1(v.real_mean)} dB</b>. A broken frame would score far lower. (Flat wall close-ups also match easily: see the limits.)`;
    const svg = el('s2'), W = 924, H = 246, m = { l: 48, r: 14, t: 14, b: 50 };
    const nd = fc.nn_dream, nr = fc.nn_real;
    const lo2 = Math.min(...nd, ...nr) - 0.5, hi2 = Math.max(...nd, ...nr) + 0.5, st2 = niceStep(hi2 - lo2, 5);
    const [yMin, yMax] = niceRange(lo2, hi2, st2);
    const { X, Y } = frame(svg, W, H, m, yMin, yMax, st2);
    const sm = (a) => smoothLog(a, 0.35);
    mk('path', { d: pathOf(nr, X, Y), fill: 'none', stroke: '#8893ab', 'stroke-width': 1, opacity: .35 }, svg);
    mk('path', { d: pathOf(nd, X, Y), fill: 'none', stroke: '#f59e0b', 'stroke-width': 1, opacity: .35 }, svg);
    mk('path', { d: pathOf(sm(nr), X, Y), fill: 'none', stroke: '#8893ab', 'stroke-width': 2.4, 'stroke-dasharray': '9 6' }, svg);
    mk('path', { d: pathOf(sm(nd), X, Y), fill: 'none', stroke: '#f59e0b', 'stroke-width': 3.6, 'stroke-linecap': 'round' }, svg);
    const ly = m.t + 6, lx = m.l + 14;
    mk('line', { x1: lx, x2: lx + 34, y1: ly, y2: ly, stroke: '#f59e0b', 'stroke-width': 3.6, 'stroke-linecap': 'round' }, svg);
    mk('text', { x: lx + 46, y: ly + 5, class: 'legend-t' }, svg, 'dreamed frames');
    mk('line', { x1: lx + 190, x2: lx + 224, y1: ly, y2: ly, stroke: '#8893ab', 'stroke-width': 2.4, 'stroke-dasharray': '9 6' }, svg);
    mk('text', { x: lx + 236, y: ly + 5, class: 'legend-t' }, svg, 'true game frames (reference)');
  }

  // ---- footer: provenance
  const by = (n) => (d.step >= 1000 ? `${Math.round(d.step / 1000)}k` : d.step);
  el('foot').innerHTML = `<b>${(d.params / 1e6).toFixed(2)}M parameters</b> &middot; ${by()} training steps &middot; ${cfg.steps} Euler steps per frame &middot; context noise ${cfg.ctx_sigma} &middot; ${cfg.init} sampler start<br>` +
    `Curves are drawn lightly smoothed over a window of &plusmn;12% of the frame index (&plusmn;35% in the lower panel); the dots are the unsmoothed means. Source: ${path}.<br>` +
    `Recipe: DIAMOND (Alonso et al., NeurIPS 2024, MIT) &middot; EDM (Karras et al. 2022) &middot; context noise from GameNGen (Valevski et al. 2024).`;
  await document.fonts.ready;
  window.__figReady = true;
})();
</script>
</body>
</html>
