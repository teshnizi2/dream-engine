<!doctype html><meta charset="utf-8"><body><script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs';
const q = new URLSearchParams(location.search); const res = {};
try {
  for (const name of q.get('models').split(',')) {
    const sess = await ort.InferenceSession.create(`/tools/bench_models/${name}.onnx`, { executionProviders: [{ name: 'webgpu' }], enableGraphCapture: true, preferredOutputLocation: { y: 'gpu-buffer' } });
    const device = ort.env.webgpu.device;
    const C = name.startsWith('conv') ? 64 : 3;
    const arr = new Float32Array(C * 4096).fill(0.5);
    const buf = device.createBuffer({ size: arr.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, arr);
    const x = ort.Tensor.fromGpuBuffer(buf, { dataType: 'float32', dims: [1, C, 64, 64] });
    for (let i = 0; i < 8; i++) { const o = await sess.run({ x }); await o.y.getData(); }
    const ts = [];
    for (let i = 0; i < 40; i++) { const t = performance.now(); const o = await sess.run({ x }); const d = await o.y.getData(); ts.push(performance.now() - t); }
    ts.sort((a, b) => a - b);
    res[name] = { median_ms: ts[20], p10: ts[4] };
  }
} catch (e) { res.error = String(e.stack || e).slice(0, 500); }
window.__bench = res;
</script>
