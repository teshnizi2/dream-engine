<!doctype html><meta charset="utf-8"><body><script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs';
const res = {};
try {
  const sess = await ort.InferenceSession.create('/tools/bench_models/split96.onnx', { executionProviders: [{ name: 'webgpu' }] });
  const x = new ort.Tensor('float32', Float32Array.from({ length: 1536 }, (_, i) => i % 16 === 0 ? 1 : 0), [1, 1536]);
  const o = await sess.run({ x });
  res.y0 = o.y.data[0]; res.expected = 96; res.ok = Math.abs(o.y.data[0] - 96) < 1e-3;
} catch (e) { res.error = String(e.stack || e).slice(0, 600); }
window.__bench = res;
</script>
