<!doctype html><meta charset="utf-8"><body><script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs';
const res = {};
try {
  const idx = await (await fetch('/tools/bench_models/debug_index.json')).json();
  const tv = await (await fetch('/site/models/testvec.json')).json();
  const blob = new Float32Array(await (await fetch('/site/models/testvec.bin')).arrayBuffer());
  const c = tv[0]; let off = 0; const parts = []; for (const s of c.sizes) { parts.push(blob.subarray(off, off + s)); off += s; }
  const feeds = () => ({ x: new ort.Tensor('float32', parts[0], [1, 3, 64, 64]), sigma: new ort.Tensor('float32', [c.sigma], [1]), ctx: new ort.Tensor('float32', parts[1], [1, 12, 64, 64]), act: new ort.Tensor('float32', parts[2], [1, 4, 9]), ctx_sigma: new ort.Tensor('float32', [c.ctx_sigma], [1]) });
  const bytes = new Uint8Array(await (await fetch('/tools/bench_models/debug_all.onnx')).arrayBuffer());
  const layout = new URLSearchParams(location.search).get('layout') || 'NHWC';
  const sw = await ort.InferenceSession.create(bytes, { executionProviders: ['wasm'], graphOptimizationLevel: new URLSearchParams(location.search).get('opt') || 'all' });
  const ow = await sw.run(feeds());
  const sg = await ort.InferenceSession.create(bytes, { executionProviders: [{ name: 'webgpu', preferredLayout: layout }], graphOptimizationLevel: new URLSearchParams(location.search).get('opt') || 'all' });
  const og = await sg.run(feeds());
  const rows = [];
  for (const e of idx) {
    const a = ow[e.out], b = og[e.out];
    if (!a || !b) { rows.push({ ...e, missing: true }); continue; }
    const A = a.data, B = b.data; let m = 0, mag = 0;
    for (let i = 0; i < A.length; i++) { const d = Math.abs(A[i] - B[i]); if (d > m) m = d; const v = Math.abs(A[i]); if (v > mag) mag = v; }
    rows.push({ i: e.i, op: e.op, out: e.out, dims: a.dims.join('x'), maxdiff: m, mag });
  }
  res.rows = rows.filter((r) => r.missing || r.maxdiff > 1e-3 * Math.max(1, r.mag)).slice(0, 25);
  res.total = rows.length; res.bad = rows.filter((r) => r.maxdiff > 1e-3 * Math.max(1, r.mag)).length;
} catch (e) { res.error = String(e.stack || e).slice(0, 600); }
window.__bench = res;
</script>
